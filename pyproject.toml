[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "larpflow"
version = "1.1.0"
description = "Autonomous dev-log generator and multi-platform social syndication engine for developers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["developer-tools", "devlog", "social-syndication", "github", "ai-agent", "x", "linkedin", "reddit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-telegram-bot>=21.6",
    "PyGithub>=2.2.0",
    "praw>=7.7.1",
    "tweepy>=4.14.0",
    "requests>=2.31.0",
    "openai>=1.14.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
    "Pillow>=10.0.0",
]

[project.scripts]
larpflow = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*"]
